name: Firmware build

on:
  push:
    branches: [main]
    paths: ['src/**', 'main/**', 'components/**', 'sdkconfig*', 'sdkconfig.d/**', 'partitions*.csv', 'CMakeLists.txt',
            'config/**', '.github/workflows/firmware-build.yml']
  pull_request:
    paths: ['src/**', 'main/**', 'components/**', 'sdkconfig*', 'sdkconfig.d/**', 'partitions*.csv', 'CMakeLists.txt',
            'config/**', '.github/workflows/firmware-build.yml']
  workflow_dispatch:

concurrency:
  group: firmware-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp32s3
            target: esp32s3
            defaults: sdkconfig.defaults
          - name: fleet
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.d/fleet
            # IROM header offset pinned: a move churns every IROM sector of a differential OTA.
            # When a change moves it on purpose, update the offset here.
            layout: --expect-irom 0x60018 --min-free 32768
          - name: esp32
            target: esp32
            defaults: sdkconfig.defaults
    name: build (${{ matrix.name }})
    env:
      IDF_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version string counts commits
      - name: Submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive components etc/idf-devtools
      - uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-${{ hashFiles('main/idf_component.yml') }}
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build/ci -DSDKCONFIG=build/ci/sdkconfig "-DSDKCONFIG_DEFAULTS=${{ matrix.defaults }}" build
      - name: Size
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build/ci -DSDKCONFIG=build/ci/sdkconfig size | tail -15
      - name: Layout
        shell: bash
        run: |
          rc=0; python3 etc/idf-devtools/image_layout.py build/ci --min-slack 4096 || rc=$?
          [ $rc -eq 1 ] && echo "::warning::DROM is within 4 KB of a 64 KB page edge: the next rodata change may move IROM a page"
          [ $rc -le 1 ] || exit $rc
          if [ -n "${{ matrix.layout }}" ]; then python3 etc/idf-devtools/image_layout.py build/ci ${{ matrix.layout }}; fi
