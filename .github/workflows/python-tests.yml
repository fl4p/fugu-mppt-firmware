name: Python tests

on:
  push:
    branches: [main]
    paths: ['etc/**', 'test/host_py/**', 'config/**', 'src/**', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['etc/**', 'test/host_py/**', 'config/**', 'src/**', '.github/workflows/python-tests.yml']
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_migrate_side_keys diffs against an older commit
      - run: git submodule update --init etc/fugu etc/idf-devtools
      - name: esp-ota-ble host modules at the pinned version
        run: |
          v=$(awk '/^  esp-ota-ble:/{f=1} f&&/version:/{print $2; exit}' main/idf_component.yml)
          git clone -q https://github.com/fl4p/esp-ota-ble.git managed_components/esp-ota-ble
          git -C managed_components/esp-ota-ble checkout -q "$v"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest rich pyserial numpy
      - run: python -m pytest -q -p no:cacheprovider test/host_py etc/test_*.py
