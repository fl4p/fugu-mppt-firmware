<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a3340;
    --fg:#d7dde3; --muted:#8b96a3; --accent:#4493f8; --accent2:#2ea043;

  * { box-sizing:border-box; scrollbar-color:#3a4654 transparent; scrollbar-width:thin; }

  ::-webkit-scrollbar-thumb { background:#3a4654; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#4c5a6b; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; gap:10px;
           align-items:center; flex-wrap:wrap; }

  @container (max-width:380px) { .kpis .peak { flex-basis:100%; margin-left:0; } }
  .kpis .small { flex-basis:100%; font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;
                 font-variant-numeric:tabular-nums; }

  .card .s-blocked { color:var(--warn); }
  .kpis .chg { flex-basis:100%; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kpis .chg .dim, .card:not(.stale) .kpis .chg.stale, .card .cstate.stale { opacity:.5; }
  .card .rate { font-size:11px; color:var(--muted); }
  .card details.more { font-size:11px; color:var(--muted); }

  .card .reconnect { align-self:flex-start; font-size:12px; padding:3px 10px; }
  .card button.forget { padding:0 6px; font-size:13px; line-height:1.2; color:var(--muted); background:none; border-color:transparent; }
  .card button.forget:hover { color:var(--warn); border-color:var(--warn); }
  .logwrap { display:flex; flex-direction:column; gap:4px; }
  .logbar { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); }
  .logbar .spacer { flex:1; }
  .log { height:180px; overflow:auto; background:#0a0d12; border:1px solid var(--line);
         border-radius:6px; padding:4px 6px; font-family:ui-monospace,Menlo,monospace; font-size:10px; }
  .log div { white-space:pre; line-height:1.35; color:var(--muted); }
  .log .sent { color:var(--accent); }
  .log .ok { color:var(--accent2); }
  .log .err { color:var(--warn); }

  .card:not(.show-sc) .log .sc { display:none; }

  form.console input { flex:1; min-width:0; background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  form.console input:focus { outline:none; border-color:var(--accent); }
  /* P-vs-Vin chart: dark chart tokens, series-1 blue for the curve, slot-2 orange for "now" */
  .chartwrap { --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --grid:#2a3340; --axis:#3a4552; --surface:var(--panel); }
  .chartbar, .vinbar, .chartkeys { display:flex; gap:10px; align-items:center; font-size:11px; color:var(--muted);
                         flex-wrap:nowrap; min-width:0; white-space:nowrap; }
  .chartbar .caption, .vinbar .vincap { color:var(--fg); min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .chartbar .spacer, .vinbar .spacer { flex:1; }

  .chartkeys .key i { display:inline-block; }
  .chartkeys .k-line i { width:14px; height:2px; background:var(--series-1); border-radius:1px; }
  .chartkeys .k-recon i { width:14px; height:2px;
    background:repeating-linear-gradient(90deg, var(--series-2) 0 4px, transparent 4px 7px); opacity:.7; }
  .chartkeys .k-star i { width:12px; height:12px; background:var(--series-1);
    clip-path:polygon(50% 0,62.6% 32.7%,97.6% 34.5%,70.4% 56.6%,79.4% 90.5%,50% 71.4%,20.6% 90.5%,29.6% 56.6%,2.4% 34.5%,37.4% 32.7%); }
  .chartkeys .k-dot i { width:8px; height:8px; background:var(--series-2); border-radius:50%; }
  .chartbar button.refresh, .chartbar button.sweep { padding:1px 8px; font-size:12px; flex:none; }
  svg.chart, svg.vinchart { width:100%; height:auto; display:block; }
  svg.chart .grid line, svg.vinchart .grid line { stroke:var(--grid); stroke-width:1; }
  svg.chart .base, svg.vinchart .base { stroke:var(--axis); stroke-width:1; }
  svg.chart text, svg.vinchart text { fill:var(--muted); font-size:9px; font-variant-numeric:tabular-nums; }
  svg.chart text.empty { font-size:11px; }
  svg.chart path.curve { fill:none; stroke:var(--series-1); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  svg.chart path.curve.flagged { stroke-opacity:.45; stroke-dasharray:5 3; }
  svg.chart path.recon { fill:none; stroke:var(--series-2); stroke-opacity:.7; stroke-width:1.5; stroke-dasharray:4 3; stroke-linejoin:round; }
  svg.chart path.recon.stale { stroke-opacity:.3; }
  svg.chart path.mpp { fill:var(--series-1); }
  svg.chart path.mpp-halo { fill:none; stroke:var(--surface); stroke-width:3; stroke-linejoin:round; }
  svg.chart circle.live { fill:var(--series-2); stroke:var(--surface); stroke-width:2; }
  svg.chart .hover line { stroke:var(--muted); stroke-width:1; }
  svg.chart .hover text { fill:var(--fg); font-size:10px; }

<script>
  // ESP_LOG / sweep-plot output is ANSI-coloured (SGR). Self-contained converter (no CDN/ESM
  // import, so colouring still works on an offline bench) -> escapes its input and wraps coloured
  // runs in a single open <span>, kept well-nested so createContextualFragment splices cleanly.
  // Caller (ulLine) only invokes it when the line actually contains an ESC sequence.
  (function(){
    const FG = {  // dark-terminal palette, codes 30-37 (normal) + 90-97 (bright)
      30:"#555",31:"#e06c75",32:"#98c379",33:"#d19a66",34:"#61afef",35:"#c678dd",36:"#56b6c2",37:"#abb2bf",
      90:"#777",91:"#e06c75",92:"#98c379",93:"#e5c07b",94:"#61afef",95:"#c678dd",96:"#56b6c2",97:"#ffffff"
    };
    const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    window.ansiConvert = { toHtml(s){
      let out="", open=false, color=null, bold=false, last=0, m;
      const re=/\x1b\[([0-9;]*)m/g;
      const apply = () => {
        if(open){ out+="</span>"; open=false; }
        if(color===null && !bold) return;
        out += '<span style="'+(color!==null?"color:"+color+";":"")+(bold?"font-weight:bold;":"")+'">';
        open=true;
      };
      while((m=re.exec(s))){
        out += esc(s.slice(last, m.index));
        last = re.lastIndex;
        for(const c of (m[1]||"0").split(";").map(x => x===""?0:+x)){
          if(c===0){ color=null; bold=false; }
          else if(c===1) bold=true;
          else if(c===22) bold=false;
          else if(c===39) color=null;
          else if(FG[c]!==undefined) color=FG[c];
        }
        apply();
      }
      out += esc(s.slice(last));
      if(open) out+="</span>";
      return out;
    }};
  })();
</script>
<script>
"use strict";
(function(){
const TD = window.TeleDec;
const NUS_SVC  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX   = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX   = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TELE = "6e400005-b5a3-f393-e0a9-e50e24dcca9e";
// url/user/hosts are shared with conf-editor.html; the password keys are the dashboard's own
const LS = { url:"mqtt-url", user:"mqtt-user", pass:"dash-mqtt-pass", remember:"dash-mqtt-remember",
             hosts:"mqtt-known-hosts", console:"dash-console", snap:"dash-devices" };
const MODES = ["N/A", "CV", "CC", "CP", "MPPT", "Sweep"];
const LEASE_S = 120, RENEW_MS = 60000, LEASE_WAIT_MS = 5000, SILENT_MS = 15000, PROBE_MS = 60000, CURVE_RETRIES = 2;
const CFG = { curveTimeoutMs:4000, curveDebounceMs:1500, bleBackoffMs:[1000, 3000, 9000], bleRetryMs:500,
              hostnameMs:8000, snapMs:10000, snapMax:16, wsProbeMs:3000, confMs:6000,
              chargerMs:300000, chargerTimeoutMs:6000 };
const SNAP_T = ["P","Ui","Uo","I","duty","state","Pmax","Etoday","ntcT","mcuT","Ro","Rc","Rb"];
const LOG_KEEP = 200, LOG_SHOW = 100;
// live P-V reconstruction: bin width V, faded after ms, bin cap, overwrite radius bins, path break V
const RECON = { bin:0.25, staleMs:600000, max:400, near:2, gapV:2 };
// plotted values outside these are ignored
const LIM = { P:50000, V:2000 };
const sane = (V, P) => Number.isFinite(V) && Number.isFinite(P) && V >= 0 && V <= LIM.V && Math.abs(P) <= LIM.P;
const SPLIT_MAX = 16384;

// Device reply patterns (contract with src/cli.cpp)
const REPLY = {
  hostname:   /Hostname:\s*(\S+)/,
  ok:         /\bOK: /,
  err:        /\bERR: /,
  unknown:    /Unknown command|Command not found/,
  mqttOn:     /tele-mqtt: on, (\d+) s left, dropped (\d+) B/,
  mqttOff:    /tele-mqtt: off\b/,
  mqttReason: /tele-mqtt: (.+?)\s*$/,
  mqttRetry:  /mqtt not connected|clock not set|low heap|out of memory/,
  bleState:   /tele-ble: (on|off) \(dropped (\d+) B\)/,
  bleReason:  /tele-ble: (.+?)\s*$/,
  stopSweep:  /Stop sweep/,
  sweepVerdict: /sweep (?:verified|flagged):/,
  sc:         /(?:^|[^A-Za-z0-9_])sc:/,
  status:     /^V=\d/,
  statusLine: /^V=\s*(\S+)\/\s*(\S+) I=\s*(\S+)\/\s*(\S+)A\s+(\S+)W .*?\bst=(\S+?),\d/,
};

const now = () => Date.now();
const lsGet = (k) => { try { return localStorage.getItem(k); } catch(_){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(_){} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch(_){} };
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

class Ring {
  constructor(cap){ this.cap = cap; this.a = []; }
  push(x){ this.a.push(x); if (this.a.length > this.cap) this.a.splice(0, this.a.length - this.cap); }
  get length(){ return this.a.length; }
  last(){ return this.a[this.a.length - 1]; }
}

// Streaming UTF-8 line splitter: a glyph may straddle two notifications/messages.
function lineSplitter(onLine){
  let dec = new TextDecoder(), buf = "";
  return {
    feed(bytes){
      buf += dec.decode(bytes, {stream:true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const ln = buf.slice(0, i).replace(/\r$/, "");
        buf = buf.slice(i + 1);
        onLine(ln);
      }
      if (buf.length > SPLIT_MAX) buf = "";
    },
    reset(){ dec = new TextDecoder(); buf = ""; },
  };
}

function median(a){
  if (!a.length) return NaN;
  const s = a.slice().sort((x, y) => x - y), m = s.length >> 1;
  return s.length & 1 ? s[m] : (s[m - 1] + s[m]) / 2;
}
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

/* ---------------------------------------------------------------------------------------------
   Device model: one card per hostname, fed by BLE and/or MQTT.
--------------------------------------------------------------------------------------------- */
const devices = new Map();

class Device {
  constructor(host){
    this.host = host;
    this.ble = null;
    this.mqtt = { table:new Map(), split:lineSplitter(ln => onLine(this, ln, "mqtt")),
                  firstAt:0, teleSeen:false, teleAt:0, errors:0,
                  lease:{ state:"off", reason:"", left:0, dropped:0, at:0, busy:false, retry:false, clockTried:false, silentAt:0 } };
    this.tele = {};
    this.alerts = new Map(); // source -> {lvl, msg, t}
    this.lastTs = 0; this.lastAt = 0;
    this.intervals = new Ring(50);
    this.arrivals = { ble:[], mqtt:[], test:[] };
    this.seenTs = new Set(); this.seenQ = [];
    this.points = new Ring(2000);
    this.curve = null; this.curveNone = false;
    this.sc = new TD.SweepCurveParser();
    this.curveReq = null; this.curveTimer = null; this.curveErr = "";
    this.log = new Ring(LOG_KEEP); this.logNew = [];
    this.history = []; this.histIdx = 0;
    this.lineListeners = new Set();
    this.el = null; this.ver = 0; this.pTop = 1;
    this.recon = new Map(); this.reconVer = 0;
    this.keep = false; this.restored = false; this.seenAt = 0; this.via = { ble:false, mqtt:false };
    this.snapAt = 0; this.snapTimer = null; this.bleId = ""; this.bleName = "";
    this.chg = null; this.chgReq = false; this.chgReqAt = 0; this.chgRestored = false;
  }
}

function getDevice(host, src){
  let dev = devices.get(host);
  if (!dev){
    dev = new Device(host);
    devices.set(host, dev);
    scheduleRender(dev);
  }
  if (src === "mqtt" && !dev.mqtt.firstAt){
    dev.mqtt.firstAt = now();
    rememberHost(host);
    touch(dev, true);
  }
  return dev;
}

/* ---------------------------------------------------------------------------------------------
   Snapshots: last values per hostname in localStorage, restored as stale cards on load
--------------------------------------------------------------------------------------------- */
function loadSnaps(){
  try { const o = JSON.parse(lsGet(LS.snap) || "{}"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; }
  catch(_){ return {}; }
}

function snapOf(dev, old){
  const t = {};
  for (const k of SNAP_T) if (Number.isFinite(dev.tele[k])) t[k] = dev.tele[k];
  const b = dev.ble && dev.ble.device;
  return { host:dev.host, seen:Math.max(dev.seenAt, dev.lastAt, (old && old.seen) || 0),
           via:{ ble:dev.via.ble || !!dev.ble, mqtt:dev.via.mqtt || !!dev.mqtt.firstAt },
           tele:t, lastAt:dev.lastAt, curve:dev.curve, pTop:dev.pTop,
           bleId:(b && b.id) || dev.bleId, bleName:(b && b.name) || dev.bleName, chg:dev.chg };
}

// Writes the given devices into the stored set (other hosts kept), newest CFG.snapMax by `seen`.
function saveSnaps(list = [...devices.values()]){
  const all = loadSnaps();
  for (const dev of list){
    if (!dev.keep || devices.get(dev.host) !== dev) continue;
    clearTimeout(dev.snapTimer); dev.snapTimer = null; dev.snapAt = now();
    all[dev.host] = snapOf(dev, all[dev.host]);
  }
  const keep = Object.values(all).filter(x => x && x.host).sort((a, b) => (b.seen || 0) - (a.seen || 0))
    .slice(0, CFG.snapMax);
  lsSet(LS.snap, JSON.stringify(Object.fromEntries(keep.map(x => [x.host, x]))));
}

// Activity on a device: keep it and save at most every CFG.snapMs.
function touch(dev, keep){
  if (keep) dev.keep = true;
  dev.seenAt = now();
  if (!dev.keep || dev.snapTimer) return;
  dev.snapTimer = setTimeout(() => saveSnaps([dev]), clamp(dev.snapAt + CFG.snapMs - now(), 0, CFG.snapMs));
}

function restoreSnaps(){
  const list = Object.values(loadSnaps()).filter(x => x && typeof x.host === "string" && x.host)
    .sort((a, b) => (b.seen || 0) - (a.seen || 0)).slice(0, CFG.snapMax);
  for (const s of list){
    if (devices.has(s.host)) continue;
    const dev = new Device(s.host);
    Object.assign(dev.tele, s.tele || {});
    dev.lastAt = +s.lastAt || 0; dev.seenAt = +s.seen || 0;
    if (s.curve && Array.isArray(s.curve.points) && s.curve.mpp){ dev.curve = s.curve; dev.curveRestored = true; }
    if (Number.isFinite(s.pTop)) dev.pTop = s.pTop;
    dev.via = { ble:!!(s.via && s.via.ble), mqtt:!!(s.via && s.via.mqtt) };
    dev.bleId = s.bleId || ""; dev.bleName = s.bleName || "";
    if (s.chg && typeof s.chg === "object" && CHG_STATES.includes(s.chg.state)){ dev.chg = s.chg; dev.chgRestored = true; }
    dev.keep = dev.restored = true; dev.snapAt = now();
    devices.set(s.host, dev);
    renderCard(dev);
  }
  $("empty").style.display = devices.size ? "none" : "";
}

function forget(dev){
  if (!window.confirm("Forget " + dev.host + "? Its saved values and card are removed.")) return;
  const all = loadSnaps();
  delete all[dev.host];
  lsSet(LS.snap, JSON.stringify(all));
  if (dev.ble) dev.ble.disconnect();
  removeDevice(dev);
  $("empty").style.display = devices.size ? "none" : "";
}

function bleTeleOn(dev){ return !!(dev.ble && dev.ble.state === "on" && dev.ble.tele === "on"); }

// One decoded point from either source; the same point over BLE and MQTT is kept once (by ts).
function ingest(dev, p, src){
  const f = p.fields, t = dev.tele;
  if (!("P" in f) && !("Ui" in f) && !("mppt_state" in f)) return false;
  if (p.ts){
    const key = p.ts + ":" + Object.keys(f).join(",");
    if (dev.seenTs.has(key)) return false;
    dev.seenTs.add(key); dev.seenQ.push(key);
    if (dev.seenQ.length > 2000) dev.seenTs.delete(dev.seenQ.shift());
  }
  const prevState = t.state;
  for (const [k, n] of [["P","P"],["Ui","Ui"],["Uo","Uo"],["I","I"],["pwm_duty","duty"],["mppt_state","state"],
                         ["P_max_today","Pmax"],["E_today","Etoday"],["E","E"],["mcu_temp","mcuT"],
                         ["ntc_temp","ntcT"],["lag","lag"],["heap","heap"],["heap_min","heapMin"],
                         ["Ro","Ro"],["Rc","Rc"],["Rb","Rb"]])
    if (k in f) t[n] = f[k];
  const at = now();
  if (p.ts && dev.lastTs && p.ts > dev.lastTs) dev.intervals.push(p.ts - dev.lastTs);
  if (p.ts > dev.lastTs) dev.lastTs = p.ts;
  dev.lastAt = at; dev.restored = false;
  touch(dev, true);
  const arr = dev.arrivals[src] || (dev.arrivals[src] = []);
  arr.push(at);
  while (arr.length && arr[0] < at - 10000) arr.shift();
  dev.points.push({ ts:p.ts || at, P:t.P, Ui:t.Ui, src });
  if (sane(f.Ui, f.P)) reconAdd(dev, f.Ui, f.P, p.ts || at, at);
  onPointState(dev, prevState, t.state);
  scheduleRender(dev);
  return true;
}

// Binned P-V curve from the live stream: the newest sample replaces its bin and the existing bins within ±0.5 V.
function reconAdd(dev, v, p, ts, at){
  const k = Math.round(v / RECON.bin);
  if (!dev.recon.has(k)){
    if (dev.recon.size >= RECON.max){
      let old = null;
      for (const [k, o] of dev.recon) if (!old || o.at < old[1].at) old = [k, o];
      dev.recon.delete(old[0]);
    }
    dev.recon.set(k, { V:k * RECON.bin, P:p, ts, at });
  }
  for (let j = k - RECON.near; j <= k + RECON.near; j++){
    const b = dev.recon.get(j);
    if (!b) continue;
    b.P = p; b.at = at;
    if (ts > b.ts) b.ts = ts;
  }
  dev.reconVer++;
}

// Re-render when a bin crosses the stale age.
function reconAge(dev, at){
  let n = 0;
  for (const b of dev.recon.values()) if (at - b.at > RECON.staleMs) n++;
  if (n === (dev.reconStaleN || 0)) return false;
  dev.reconStaleN = n; dev.reconVer++;
  return true;
}

function reconPoints(dev){
  if (dev.reconPtsVer !== dev.reconVer){
    dev.reconPtsVer = dev.reconVer;
    dev.reconPts = [...dev.recon.values()].sort((a, b) => a.V - b.V);
  }
  return dev.reconPts;
}

// Fetch the sweep curve once a sweep (mppt_state 5) ends.
function onPointState(dev, prev, cur){
  if (prev === 5 && cur !== 5 && cur !== undefined) scheduleCurve(dev, CFG.curveDebounceMs);
}

function pushLog(dev, cls, text){
  const e = { cls, text };
  dev.log.push(e); dev.logNew.push(e);
  if (dev.logNew.length > LOG_SHOW) dev.logNew.splice(0, dev.logNew.length - LOG_SHOW);
  scheduleRender(dev);
}

function lineClass(ln){
  let cls = REPLY.ok.test(ln) ? "ok" : REPLY.err.test(ln) ? "err" : "";
  const plain = TD.stripAnsi(ln);
  if (REPLY.sc.test(plain)) cls += " sc";
  else if (REPLY.status.test(plain)) cls += " st";
  return cls.trim();
}

// Every console line of a device, from either transport.
function onLine(dev, ln, src){
  // with BLE up, the MQTT log mirror carries the same lines
  if (src === "mqtt" && dev.ble && dev.ble.state === "on") return;
  pushLog(dev, lineClass(ln), ln);
  touch(dev);
  dev.lineListeners.forEach(fn => fn(ln));
  const plain = TD.stripAnsi(ln);
  let m;
  if ((m = REPLY.mqttOn.exec(plain))){
    const L = dev.mqtt.lease; L.left = +m[1]; L.dropped = +m[2]; L.leftAt = now();
  } else if (REPLY.mqttOff.test(plain)){
    dev.mqtt.lease.left = 0;
  }
  if ((m = REPLY.bleState.exec(plain)) && dev.ble){ dev.ble.dropped = +m[2]; }
  if (REPLY.stopSweep.test(plain) || REPLY.sweepVerdict.test(plain)) scheduleCurve(dev, CFG.curveDebounceMs);
  if ((m = REPLY.statusLine.exec(plain))) ingestStatus(dev, m);
  const r = dev.sc.feed(ln);
  if (r) onCurve(dev, r);
}

function onCurve(dev, r){
  if (r.complete){
    if (r.curve && !(dev.curve && dev.curve.t === r.curve.t)) dev.pTop = 1; // new sweep: the y axis starts over
    if (r.curve){ dev.curve = r.curve; dev.curveNone = false; }
    else { dev.curve = null; dev.curveNone = true; }
    dev.curveErr = ""; dev.curveRestored = false;
    touch(dev, true);
    dev.ver++;
    finishCurveReq(dev);
  } else if (r.reason !== "restart" && dev.curveReq){
    clearTimeout(dev.curveTimer);
    curveAttempt(dev);
  }
  scheduleRender(dev);
}

/* ---------------------------------------------------------------------------------------------
   Commands
--------------------------------------------------------------------------------------------- */
function canSend(dev){ return (dev.ble && dev.ble.state === "on") || mqttReady(); }

async function send(dev, cmd, via){
  cmd = String(cmd).replace(/[\r\n]+$/, "").trim();
  if (!cmd) return;
  if (via !== "mqtt" && dev.ble && dev.ble.state === "on") return dev.ble.write(cmd + "\r\n");
  if (via !== "ble" && mqttReady()) return mqttPublish("pv/log/" + dev.host + "/cmd", cmd);
  throw new Error("not connected");
}

// "OK: <cmd>" / "ERR: <cmd>" followed by end of line or a non-word character
function replyMarker(cmd){
  return new RegExp("\\b(OK|ERR): " + cmd.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?=$|\\W)");
}

// Resolves {ok, lines} at the device's "OK: <cmd>" / "ERR: <cmd>" marker; rejects on timeout.
// fn.owner is the device whose listener set holds fn (moved by attachBle on a card merge).
function sendCommand(dev, cmd, { onRx, timeoutMs = 4000, via } = {}){
  return new Promise((resolve, reject) => {
    const lines = [], re = replyMarker(String(cmd).trim());
    const fn = (ln) => {
      lines.push(ln);
      if (onRx) onRx(ln);
      const m = re.exec(TD.stripAnsi(ln));
      if (m){ done(); resolve({ ok:m[1] === "OK", lines }); }
    };
    const timer = setTimeout(() => { done(); const e = new Error("timeout"); e.lines = lines; reject(e); }, timeoutMs);
    const done = () => { clearTimeout(timer); fn.owner.lineListeners.delete(fn); };
    fn.owner = dev;
    dev.lineListeners.add(fn);
    send(dev, cmd, via).catch(e => { done(); reject(e); });
  });
}

function scheduleCurve(dev, delay){
  clearTimeout(dev.curveDebounce);
  dev.curveDebounce = setTimeout(() => requestCurve(dev), delay);
}

// Single in-flight `sweep-curve`, 4 s timeout, 2 retries.
function requestCurve(dev){
  if (dev.curveReq || !canSend(dev)) return false;
  dev.curveReq = { tries:0 };
  curveAttempt(dev);
  return true;
}
function curveAttempt(dev){
  const q = dev.curveReq;
  if (!q) return;
  if (q.tries > CURVE_RETRIES){ dev.curveErr = "no sweep-curve reply"; finishCurveReq(dev); scheduleRender(dev); return; }
  q.tries++;
  dev.curveTimer = setTimeout(() => curveAttempt(dev), CFG.curveTimeoutMs);
  send(dev, "sweep-curve").catch(e => { dev.curveErr = e.message; finishCurveReq(dev); scheduleRender(dev); });
}
function finishCurveReq(dev){
  clearTimeout(dev.curveTimer); dev.curveTimer = null; dev.curveReq = null;
}

// `status` reply (src/cli.cpp cmdStatus) -> charger snapshot; unmatched fields stay undefined.
const CHG_STATES = ["terminated", "charging", "blocked", "hold"];
const CHG_RE = {
  state:   /Charger: (TERMINATED|charging|BLOCKED|PARTIAL HOLD)\b(?: \(([^)]*)\))?/,
  limits:  /Vbat_max=(\S+?)V Vout_max=(\S+?)V\s+Ibat_lim=(\S+?)A Iout_max=(\S+?)A/,
  bms:     /BMS vcell_high=(\S+?)V \(([^,]+), (\d+)s ago\)\s+ibat=(\S+?)A \(([^,]+), (\d+)s ago\)/,
  dod:     /DoD since full: (\S+?)% \/ (\S+?)% to recharge/,
  ceiling: /ceiling=(\S+?)%\s+last full (?:(\S+?)h ago \(full charge every (\S+?) d\)|unknown)/,
  holiday: /(?:^|\s)holiday (ON|off) \((auto|on|off)\)\s+quiet days (\d+)\/(\d+)/,
  temp:    /pack temp (-?[\d.]+?)\.\.(-?[\d.]+?)°C/,
};
function parseChargerStatus(lines){
  const c = {}, num = (x) => { const v = Number(x); return x !== undefined && Number.isFinite(v) ? v : undefined; };
  const find = (re) => { for (const l of lines){ const m = re.exec(TD.stripAnsi(String(l))); if (m) return m; } return null; };
  let m;
  if ((m = find(CHG_RE.state))){
    c.state = { TERMINATED:"terminated", charging:"charging", BLOCKED:"blocked", "PARTIAL HOLD":"hold" }[m[1]];
    if (m[2]) c.detail = m[2];
  }
  if ((m = find(CHG_RE.limits))){ c.vbatMax = num(m[1]); c.voutMax = num(m[2]); c.ibatLim = num(m[3]); c.ioutMax = num(m[4]); }
  if ((m = find(CHG_RE.bms))){
    c.vcell = num(m[1]); c.vcellOk = m[2] === "ok"; c.vcellAgeS = num(m[3]);
    c.ibat = num(m[4]); c.ibatOk = m[5] === "ok"; c.ibatAgeS = num(m[6]);
  }
  if ((m = find(CHG_RE.dod))){ c.dod = num(m[1]); c.dodRecharge = num(m[2]); }
  if ((m = find(CHG_RE.ceiling))){ c.ceiling = num(m[1]); c.lastFullH = num(m[2]); c.fullEveryD = num(m[3]); }
  if ((m = find(CHG_RE.holiday))){ c.holiday = m[1]; c.holidayMode = m[2]; c.quietDays = num(m[3]); c.quietNeed = num(m[4]); }
  if ((m = find(CHG_RE.temp))){ c.packTempMin = num(m[1]); c.packTempMax = num(m[2]); }
  c.at = now();
  return c;
}

// Single in-flight `status`, CFG.chargerTimeoutMs, one retry on a timeout.
async function requestChargerStatus(dev){
  if (dev.chgReq || !canSend(dev)) return false;
  dev.chgReq = true; dev.chgReqAt = now();
  try {
    for (let i = 0; i < 2; i++){
      let r;
      try { r = await sendCommand(dev, "status", { timeoutMs:CFG.chargerTimeoutMs }); }
      catch(e){ if (e.message === "timeout" && i === 0 && canSend(dev)) continue; return false; }
      const c = parseChargerStatus(r.lines);
      if (!c.state) return false;
      dev.chg = c; dev.chgRestored = false;
      touch(dev, true);
      scheduleRender(dev);
      return true;
    }
    return false;
  } finally { dev.chgReq = false; }
}

/* ---------------------------------------------------------------------------------------------
   MQTT: discovery, telemetry, lease
--------------------------------------------------------------------------------------------- */
let client = null, clientUrl = "", clientUp = false;
const mqttReady = () => !!(client && clientUp);

function mqttPublish(topic, msg){
  return new Promise((res, rej) => client.publish(topic, msg, { qos:0 }, e => e ? rej(e) : res()));
}

function knownHosts(url){
  try { return (JSON.parse(lsGet(LS.hosts) || "{}")[url]) || []; } catch(_){ return []; }
}
function rememberHost(host){
  const url = clientUrl;
  if (!url || !host) return;
  let all = {}; try { all = JSON.parse(lsGet(LS.hosts) || "{}"); } catch(_){}
  const list = Array.isArray(all[url]) ? all[url].filter(h => h !== host) : [];
  list.unshift(host);
  all[url] = list.slice(0, 32);
  lsSet(LS.hosts, JSON.stringify(all));
}

function setStatus(text, isErr){
  const s = $("mqtt-status"); s.textContent = text; s.classList.toggle("err", !!isErr);
}

function mqttConnect(url, user, pass){
  mqttDisconnect();
  url = (url || "").trim();
  if (!url) return null;
  if (!window.mqtt){ setStatus("mqtt.js did not load", true); return null; }
  clientUrl = url;
  let c;
  try { c = window.mqtt.connect(url, { username:user || undefined, password:pass || undefined,
                                       reconnectPeriod:5000, connectTimeout:5000 }); }
  catch(e){ setStatus(e.message, true); return null; }
  client = c;
  setStatus("connecting…");
  $("mqtt-connect").textContent = "Disconnect";
  c.on("connect", () => {
    if (client !== c) return;
    clientUp = true;
    setStatus("connected");
    for (const t of ["pv/log/#", "pv/alert/#", "pv/tele/#"]) c.subscribe(t, { qos:0 }, () => {});
    for (const h of new Set([...knownHosts(url), ...Object.keys(loadSnaps())])) c.publish("pv/log/" + h + "/cmd", "hostname", { qos:0 }, () => {});
    for (const dev of devices.values()){
      const L = dev.mqtt.lease;
      if (L.state !== "off" && L.state !== "relay") lease(dev);
      if (dev.mqtt.firstAt){ requestCurve(dev); requestChargerStatus(dev); } // a sweep may have ended while the broker was away
    }
    renderAllSoon();
  });
  c.on("message", (topic, payload, pkt) => { if (client === c) onMqttMessage(topic, payload, pkt); });
  c.on("error", (e) => { if (client === c) setStatus(e.message || String(e), true); });
  c.on("close", () => { if (client !== c) return; clientUp = false; setStatus("disconnected, retrying…", true); renderAllSoon(); });
  return c;
}

function mqttDisconnect(){
  const c = client;
  client = null; clientUp = false;
  $("mqtt-connect").textContent = "Connect";
  if (c){ try { c.end(true); } catch(_){} setStatus("disconnected"); }
  renderAllSoon();
}

function u8(payload){ return payload instanceof Uint8Array ? payload : new Uint8Array(payload); }

function onMqttMessage(topic, payload, pkt){
  const parts = topic.split("/");
  if (parts[0] !== "pv" || !parts[2]) return;
  const kind = parts[1], host = parts[2];
  if (kind === "log" && parts.length === 3){
    getDevice(host, "mqtt").mqtt.split.feed(u8(payload));
  } else if (kind === "alert" && parts.length === 4){
    // a retained alert may outlive its device (renamed host): no card for it
    const retained = !!(pkt && pkt.retain);
    if (retained && !devices.has(host)) return;
    const dev = getDevice(host, "mqtt");
    const text = new TextDecoder().decode(u8(payload)).trim();
    let a = null;
    try { a = JSON.parse(text); } catch(e) {}
    if (a && typeof a === "object" && typeof a.lvl === "string") dev.alerts.set(parts[3], { lvl:a.lvl, msg:String(a.msg || ""), t:+a.t || 0 });
    else dev.alerts.set(parts[3], { lvl:"warn", msg:text, t:0 });
    if (!retained) pushLog(dev, "alert", "[alert " + parts[3] + "] " + text);
    scheduleRender(dev);
  } else if (kind === "tele" && parts.length === 3){
    ingestTele(host, payload, "mqtt");
  }
}

// One MQTT telemetry message `<cid><payload>` (also the test/demo entry point).
// The periodic status line (V=<Vin>/<Vout> I=<Iin>/<Iout>A <P>W ... st=<mode>,<n>) carries the live operating
// point; it keeps the card current between telemetry points (a device in its idle profile sends one per
// idle_interval_ms). No timestamp: never deduplicated, never counted as a telemetry interval.
const STATUS_STATES = { "N/A":0, CV:1, CC:2, CP:3, MPPT:4, SWEEP:5 };
function ingestStatus(dev, m){
  const [Ui, Uo, , I, P] = m.slice(1, 6).map(Number);
  if (![Ui, Uo, I, P].every(Number.isFinite)) return;
  const f = { Ui, Uo, I, P };
  const st = STATUS_STATES[m[6].replace(/[^A-Z/]/g, "")];
  if (st !== undefined) f.mppt_state = st;
  ingest(dev, { fields:f, ts:0 }, "status");
  scheduleRender(dev);
}

function ingestTele(host, bytes, src = "mqtt"){
  const dev = getDevice(host, src === "mqtt" ? "mqtt" : undefined);
  const b = u8(bytes);
  if (!b.length) return [];
  const pts = [];
  if (src === "mqtt"){ dev.mqtt.teleSeen = true; dev.mqtt.teleAt = now(); }
  try { TD.decodePayload(b[0], b.subarray(1), dev.mqtt.table, pts); }
  catch(e){ dev.mqtt.errors++; }
  for (const p of pts) ingest(dev, p, src);
  if (src === "mqtt") maybeRenew(dev);
  scheduleRender(dev);
  return pts;
}

function leaseWanted(dev){
  return mqttReady() && !bleTeleOn(dev) && dev.mqtt.lease.state !== "relay";
}

// Periodic and silence retry: running lease, missing reply, transient refusal.
function leaseRetries(L){
  return L.state === "on" || L.state === "no-reply" || (L.state === "refused" && L.retry);
}

// `tele-mqtt 120` over MQTT; reply decides the card state.
async function lease(dev){
  const L = dev.mqtt.lease;
  if (L.busy || !mqttReady()) return;
  L.busy = true; L.at = now();
  if (L.state === "off") L.state = "pending";
  try {
    const r = await sendCommand(dev, "tele-mqtt " + LEASE_S, { via:"mqtt", timeoutMs:5000 });
    const plain = r.lines.map(TD.stripAnsi);
    const on = plain.map(l => REPLY.mqttOn.exec(l)).find(Boolean);
    L.retry = false;
    if (r.ok){
      L.state = "on"; L.reason = "";
      if (on){ L.left = +on[1]; L.dropped = +on[2]; L.leftAt = now(); }
    } else {
      let reason = "";
      for (const l of plain){
        const m = REPLY.mqttReason.exec(l);
        if (m && !REPLY.mqttOn.test(l) && !REPLY.mqttOff.test(l)) reason = m[1];
      }
      if (plain.some(l => REPLY.unknown.test(l))){
        L.state = "relay"; L.reason = "firmware without tele-mqtt (relay-fed)";
      } else if (/clock/.test(reason) && !L.clockTried){
        L.clockTried = true;
        L.busy = false;
        await send(dev, "set-time " + now(), "mqtt");
        return await lease(dev);
      } else {
        L.state = "refused"; L.reason = reason || "tele-mqtt refused"; L.retry = REPLY.mqttRetry.test(reason);
      }
    }
  } catch(e){
    if ((e.lines || []).some(l => REPLY.unknown.test(TD.stripAnsi(l)))){
      L.state = "relay"; L.reason = "firmware without tele-mqtt (relay-fed)";
    } else {
      L.state = "no-reply"; L.reason = e.message === "timeout" ? "no reply to tele-mqtt" : e.message;
    }
  } finally {
    L.busy = false;
    scheduleRender(dev);
  }
}

function maybeRenew(dev){
  const L = dev.mqtt.lease;
  if (L.state === "on" && now() - L.at >= RENEW_MS && leaseWanted(dev)) lease(dev);
}

/* ---------------------------------------------------------------------------------------------
   BLE: one NUS link per device
--------------------------------------------------------------------------------------------- */
class BleLink {
  constructor(device){
    this.device = device;
    this.dev = null;
    this.state = "off"; this.reason = ""; this.tele = "off"; this.teleReason = "";
    this.dropped = 0; this.retries = 0; this.userClosed = false; this.lastProbe = 0;
    this.server = this.rx = this.tx = this.teleChar = null;
    this.stream = new TD.TeleStream((err) => { this.decodeErr = err.message; });
    this.split = lineSplitter(ln => { if (this.dev) onLine(this.dev, ln, "ble"); });
    this.wq = Promise.resolve();
    this._onTx = (e) => this.split.feed(dv(e.target.value));
    this._onTele = (e) => {
      if (!this.dev) return;
      for (const p of this.stream.feed(dv(e.target.value))) ingest(this.dev, p, "ble");
    };
    this._onDisc = () => this.onDisconnected();
    device.addEventListener("gattserverdisconnected", this._onDisc);
  }

  get name(){ return this.device.name || this.device.id || "ble"; }

  async connect(attempts = 4){
    this.state = "connecting"; this.reason = ""; this.userClosed = false;
    if (this.dev) scheduleRender(this.dev);
    let lastErr;
    for (let i = 1; i <= attempts; i++){
      try {
        const server = await this.device.gatt.connect();
        const svc = await server.getPrimaryService(NUS_SVC);
        const rx = await svc.getCharacteristic(NUS_RX);
        const tx = await svc.getCharacteristic(NUS_TX);
        let tc = null;
        try { tc = await svc.getCharacteristic(NUS_TELE); } catch(_){}
        this.server = server; this.rx = rx; this.tx = tx; this.teleChar = tc;
        this.split.reset();
        this.stream = new TD.TeleStream((err) => { this.decodeErr = err.message; });
        await tx.startNotifications();
        tx.addEventListener("characteristicvaluechanged", this._onTx);
        if (tc){
          await tc.startNotifications();
          tc.addEventListener("characteristicvaluechanged", this._onTele);
        }
        this.state = "on"; this.retries = 0;
        return;
      } catch(e){
        lastErr = e;
        try { this.device.gatt.disconnect(); } catch(_){}
        if (i < attempts) await sleep(CFG.bleRetryMs * i);
      }
    }
    this.state = "off"; this.reason = lastErr ? lastErr.message : "connect failed";
    throw lastErr || new Error("connect failed");
  }

  // 20 B slices, write-with-response (pairing is triggered by the ATT error), serialized.
  write(str){
    const data = new TextEncoder().encode(str);
    const run = async () => {
      if (this.state !== "on" || !this.rx) throw new Error("BLE not connected");
      for (let off = 0; off < data.length; off += 20){
        const s = data.slice(off, off + 20);
        if (this.rx.writeValueWithResponse) await this.rx.writeValueWithResponse(s);
        else await this.rx.writeValue(s);
      }
    };
    const p = this.wq.then(run, run);
    this.wq = p.catch(() => {});
    return p;
  }

  // `tele-ble 1`: null when on, else the refusal reason
  async teleBle(dev){
    const r = await sendCommand(dev, "tele-ble 1", { via:"ble" });
    if (r.ok) return null;
    const plain = r.lines.map(TD.stripAnsi);
    let reason = "";
    for (const l of plain){ const m = REPLY.bleReason.exec(l); if (m && !REPLY.bleState.test(l)) reason = m[1]; }
    return reason || (plain.some(l => REPLY.unknown.test(l)) ? "firmware without tele-ble" : "tele-ble refused");
  }

  // hostname -> tele-ble 1 (set-time and one retry on a clock refusal) -> sweep-curve
  async enable(){
    const tmp = this.dev;
    let host = "";
    const onRx = (l) => { const m = REPLY.hostname.exec(TD.stripAnsi(l)); if (m) host = cleanHost(m[1]); };
    for (let i = 0; i < 2 && !host; i++){
      try { await sendCommand(tmp, "hostname", { onRx, timeoutMs:CFG.hostnameMs, via:"ble" }); } catch(_){}
    }
    if (!host) host = advHost(this.name);
    attachBle(this, host);
    const dev = this.dev;
    touch(dev, true);
    if (!this.teleChar){
      this.tele = "refused"; this.teleReason = "no telemetry characteristic (firmware without BLE telemetry)";
    } else {
      try {
        let reason = await this.teleBle(dev);
        if (reason !== null && /clock/.test(reason)){
          try { await sendCommand(dev, "set-time " + now(), { via:"ble" }); } catch(_){}
          reason = await this.teleBle(dev);
        }
        this.tele = reason === null ? "on" : "refused"; this.teleReason = reason || "";
      } catch(e){ this.tele = "refused"; this.teleReason = "no reply to tele-ble"; }
    }
    this.lastProbe = now();
    scheduleRender(dev);
    requestCurve(dev);
    requestChargerStatus(dev);
    discoverBroker(dev);
  }

  probe(){
    if (this.state !== "on" || this.tele !== "on" || !this.dev) return;
    if (now() - this.lastProbe < PROBE_MS) return;
    this.lastProbe = now();
    this.write("tele-ble\r\n").catch(() => {});
  }

  async onDisconnected(){
    // connect()'s own gatt.disconnect() between attempts, or a drop during a running reconnect loop
    if (this.state === "connecting" || this.state === "reconnecting") return;
    if (this.state === "off" && !this.server) return;
    this.server = this.rx = this.tx = this.teleChar = null;
    this.tele = "off";
    if (this.userClosed){ this.state = "off"; if (this.dev) scheduleRender(this.dev); return; }
    for (const ms of CFG.bleBackoffMs){
      this.state = "reconnecting"; this.reason = "link lost, retrying";
      if (this.dev) scheduleRender(this.dev);
      await sleep(ms);
      if (this.userClosed) break;
      try { await this.connect(1); await this.enable(); return; } catch(_){}
    }
    this.state = "off"; this.reason = "link lost";
    if (this.dev) scheduleRender(this.dev);
  }

  async reconnect(){
    try { await this.connect(); await this.enable(); }
    catch(e){ this.state = "off"; this.reason = e.message; }
    if (this.dev) scheduleRender(this.dev);
  }

  disconnect(){
    this.userClosed = true;
    try { this.device.gatt.disconnect(); } catch(_){}
    this.state = "off";
  }
}

function dv(v){ return v instanceof Uint8Array ? v : new Uint8Array(v.buffer, v.byteOffset || 0, v.byteLength); }

// Bind a link to the card of `host`, folding a provisional card into an existing one.
function attachBle(link, host){
  const old = link.dev;
  let dev = devices.get(host);
  if (old && old.host !== host){
    if (dev){
      for (const e of old.log.a) dev.log.push(e);
      dev.logNew = dev.log.a.slice(-LOG_SHOW); dev.logReset = true;
      old.lineListeners.forEach(fn => { fn.owner = dev; dev.lineListeners.add(fn); });
      old.lineListeners.clear();
      if (old.pTop > dev.pTop) dev.pTop = old.pTop;
      removeDevice(old);
    } else {
      devices.delete(old.host);
      old.host = host; dev = old;
      devices.set(host, dev);
      if (dev.el) dev.el.dataset.host = host;
    }
  }
  if (!dev) dev = getDevice(host);
  if (dev.ble && dev.ble !== link) dev.ble.disconnect();
  dev.ble = link; link.dev = dev;
  scheduleRender(dev);
  return dev;
}

function removeDevice(dev){
  clearTimeout(dev.snapTimer); dev.snapTimer = null;
  devices.delete(dev.host);
  if (dev.el) dev.el.remove();
  dev.el = null;
}

// Host names become MQTT topic levels and card keys.
const cleanHost = (s) => String(s || "").replace(/[\/+#\s]/g, "");
// Advertised `fugu-<hostname>`, or the hostname itself when it starts with fugu-.
function advHost(name){
  const n = cleanHost(name);
  return n.replace(/^fugu-/, "") || n || "ble";
}

// Start a link for a (granted) Web Bluetooth device; the card is keyed by the device name until
// `hostname` answers.
async function linkBle(btDevice, { connect = true } = {}){
  const prov = advHost(btDevice.name || btDevice.id);
  for (const d of devices.values()) if (d.ble && d.ble.device === btDevice){
    if (connect && d.ble.state === "off") await d.ble.reconnect();
    return d.ble;
  }
  const link = new BleLink(btDevice);
  attachBle(link, prov);
  if (!connect){ link.reason = "not connected"; scheduleRender(link.dev); return link; }
  try { await link.connect(); await link.enable(); }
  catch(e){ link.state = "off"; link.reason = e.message; scheduleRender(link.dev); }
  return link;
}

async function addBle(){
  if (!navigator.bluetooth) return null;
  let d;
  try {
    d = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:"fugu-" }, { services:[NUS_SVC] }], optionalServices:[NUS_SVC] });
  } catch(_){ return null; }
  return linkBle(d);
}

async function restoreBle(){
  if (!navigator.bluetooth || typeof navigator.bluetooth.getDevices !== "function") return;
  let list = [];
  try { list = await navigator.bluetooth.getDevices(); } catch(_){ return; }
  const snaps = Object.values(loadSnaps()), links = [];
  for (const d of list){
    const link = await linkBle(d, { connect:false });
    const n = d.name || "";
    if (/^fugu-/.test(n) || snaps.some(s => s && (s.host === advHost(n || d.id) || (s.bleId && s.bleId === d.id))))
      links.push(link);
  }
  // one silent attempt each; a refused (no user gesture) or failed connect leaves the Reconnect button
  await Promise.all(links.map(async (link) => {
    if (link.state !== "off") return;
    try { await link.connect(1); await link.enable(); }
    catch(e){ link.state = "off"; link.reason = (e && e.message) || "connect failed"; if (link.dev) scheduleRender(link.dev); }
  }));
}

/* ---------------------------------------------------------------------------------------------
   Rendering (coalesced, <= 4 Hz)
--------------------------------------------------------------------------------------------- */
const dirty = new Set();
let renderTimer = null, lastRender = 0;

function scheduleRender(dev){
  dirty.add(dev);
  if (renderTimer) return;
  const wait = Math.max(0, lastRender + 250 - performance.now());
  renderTimer = setTimeout(() => {
    const raf = window.requestAnimationFrame || ((f) => setTimeout(f, 0));
    raf(flush);
  }, wait);
}
function renderAllSoon(){ for (const d of devices.values()) scheduleRender(d); }

function flush(){
  clearTimeout(renderTimer); renderTimer = null;
  lastRender = performance.now();
  const list = [...dirty]; dirty.clear();
  for (const dev of list) if (devices.get(dev.host) === dev) renderCard(dev);
  $("empty").style.display = devices.size ? "none" : "";
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

  const lw = el("div", "logwrap");

const q = (dev, sel) => dev.el.querySelector(sel);
const fmt = (x, d = 1) => Number.isFinite(x) ? x.toFixed(d) : "–";

function fmtAge(ms){
  const s = Math.round(ms / 1000);
  if (s <= 2) return "now";
  if (s < 60) return s + " s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  return (s / 3600).toFixed(1) + " h ago";
}

function staleAfter(dev){
  const m = median(dev.intervals.a);
  return Number.isFinite(m) ? clamp(3 * m, 5000, 1200000) : 1200000;
}

function fmtEnergy(wh){
  if (!Number.isFinite(wh)) return "– Wh";
  return wh >= 1000 ? (wh / 1000).toFixed(2) + " kWh" : wh.toFixed(0) + " Wh";
}

function rateOf(dev, src){
  const a = dev.arrivals[src] || [];
  const t = now(), w = a.filter(x => x >= t - 10000);
  if (w.length < 2) return w.length / 10;
  return w.length / Math.max(1, (t - w[0]) / 1000);
}

function leaseLeft(L){ return Math.max(0, L.left - Math.round((now() - (L.leftAt || L.at)) / 1000)); }

function badge(e, state, title){
  e.dataset.state = state; e.title = title;
}

function renderAge(dev){
  if (!dev.el) return;
  const age = q(dev, ".age");
  if (!dev.lastAt){ age.textContent = "no data"; dev.el.classList.remove("stale"); return; }
  const a = now() - dev.lastAt;
  age.textContent = fmtAge(a);
  dev.el.classList.toggle("stale", dev.restored || a > staleAfter(dev));
}

function renderMore(dev, L){
  const t = dev.tele, kb = (x) => fmt(x / 1024, 0) + " KB", f = [];
  if (Number.isFinite(t.mcuT)) f.push("MCU " + fmt(t.mcuT, 1) + " °C");
  if (Number.isFinite(t.lag)) f.push("lag " + fmt(t.lag / 1000, 1) + " ms");
  if (Number.isFinite(t.heap)) f.push("heap " + kb(t.heap));
  if (Number.isFinite(t.heapMin)) f.push("heap_min " + kb(t.heapMin));
  if (Number.isFinite(t.E)) f.push("E " + fmt(t.E / 1000, 3) + " kWh");
  const r = ["Ro", "Rc", "Rb"].filter(k => Number.isFinite(t[k])).map(k => k + " " + fmt(t[k], 0) + " mΩ");
  if (r.length) f.push(r.join(" · "));
  if (L.state === "on") f.push("lease on, " + leaseLeft(L) + " s left");
  else if (L.state === "refused") f.push("lease refused: " + L.reason);
  else if (L.state === "no-reply") f.push("lease no reply");
  else if (L.state === "relay") f.push("lease relay-fed");
  else if (L.state === "pending") f.push("lease pending");
  const b = dev.ble;
  if (b && b.stream){ const s = b.stream.stats; f.push("BLE decode errors " + s.errors + " · resyncs " + s.resyncs); }
  if (dev.mqtt.teleSeen) f.push("MQTT decode errors " + dev.mqtt.errors);
  f.push(...chgMore(dev.chg));
  const info = q(dev, "details.more .info");
  info.replaceChildren(...f.map(x => el("span", null, x)));
}

function renderChg(dev){
  const c = dev.chg, e = q(dev, ".chg"), h = q(dev, ".cstate");
  if (!c){ e.hidden = true; h.textContent = ""; h.className = "cstate"; return; }
  const age = now() - (+c.at || 0), stale = !!dev.chgRestored || age > 2 * CFG.chargerMs;
  const title = "charger status " + fmtAge(age) + (dev.chgRestored ? " (saved)" : "");
  h.textContent = c.state + (c.detail ? " (" + c.detail + ")" : "");
  h.className = "cstate s-" + c.state + (stale ? " stale" : "");
  h.title = e.title = title;
  e.classList.toggle("stale", stale);
  const out = [];
  const add = (text, dim) => { if (out.length) out.push(document.createTextNode(" · ")); out.push(dim ? el("span", "dim", text) : document.createTextNode(text)); };
  if (Number.isFinite(c.voutMax)) add("cap " + fmt(c.voutMax, 2) + " V");
  if (Number.isFinite(c.vcell)) add("cell " + fmt(c.vcell, 3) + " V" + (c.vcellOk ? "" : " stale"), !c.vcellOk);
  if (Number.isFinite(c.dod)) add("DoD " + fmt(c.dod, 0) + " % / " + fmt(c.dodRecharge, 0) + " %");
  if (c.holiday === "ON") add("holiday");
  e.hidden = !out.length;
  e.replaceChildren(...out);
}

function chgMore(c){
  const f = [];
  if (!c) return f;
  if (Number.isFinite(c.vbatMax)) f.push("Vbat_max " + fmt(c.vbatMax, 2) + " V · Ibat_lim " + fmt(c.ibatLim, 1) + " A");
  if (Number.isFinite(c.ibat)) f.push("ibat " + fmt(c.ibat, 2) + " A" + (c.ibatOk ? "" : " stale"));
  if (Number.isFinite(c.ceiling)) f.push("ceiling " + fmt(c.ceiling, 0) + " %" + (Number.isFinite(c.lastFullH)
    ? " · last full " + fmt(c.lastFullH + (now() - (+c.at || 0)) / 3600000, 1) + " h ago" : ""));
  if (c.holiday) f.push("holiday " + c.holiday + " (" + c.holidayMode + ")"
    + (Number.isFinite(c.quietDays) ? " · quiet days " + c.quietDays + "/" + c.quietNeed : ""));
  if (Number.isFinite(c.packTempMin)) f.push("pack " + fmt(c.packTempMin, 1) + ".." + fmt(c.packTempMax, 1) + " °C");
  return f;
}

function renderCard(dev){
  if (!dev.el) createCard(dev);
  const t = dev.tele;
  q(dev, ".host").textContent = dev.host;
  // badges
  const b = dev.ble;
  q(dev, ".badge.ble").hidden = !b; // no link ever attached: no badge
  if (!b) badge(q(dev, ".badge.ble"), "off", "no BLE link");
  else if (b.state === "on" && b.tele === "on") badge(q(dev, ".badge.ble"), "on", "connected, telemetry on (" + b.name + ")");
  else if (b.state === "on" && b.tele === "refused") badge(q(dev, ".badge.ble"), "refused", b.teleReason);
  else if (b.state === "on") badge(q(dev, ".badge.ble"), "pending", "connected, enabling telemetry");
  else if (b.state === "connecting" || b.state === "reconnecting") badge(q(dev, ".badge.ble"), "pending", b.reason || b.state);
  else badge(q(dev, ".badge.ble"), "off", b.reason || "disconnected");
  q(dev, ".reconnect").style.display = b && b.state === "off" ? "" : "none";
  const L = dev.mqtt.lease;
  const mb = q(dev, ".badge.mqtt");
  if (!mqttReady() || !dev.mqtt.firstAt) badge(mb, "off", mqttReady() ? "not seen on MQTT" : "MQTT not connected");
  else if (L.state === "on") badge(mb, "on", "telemetry lease, " + leaseLeft(L) + " s left, dropped " + L.dropped + " B");
  else if (L.state === "refused" || L.state === "no-reply") badge(mb, "refused", L.reason);
  else if (L.state === "relay") badge(mb, "on", L.reason);
  else if (L.state === "pending") badge(mb, "pending", "leasing telemetry");
  else badge(mb, "on", dev.mqtt.teleSeen ? "telemetry (relay)" : "log only");
  const ab = q(dev, ".alerts");
  for (const [src, a] of dev.alerts){
    let e = [...ab.children].find(x => x.dataset.src === src);
    if (!e){ e = el("span", "badge alert", src); e.dataset.src = src; ab.append(e); }
    badge(e, a.lvl, a.lvl + (a.msg ? ": " + a.msg : "") + (a.t ? " (" + new Date(a.t * 1000).toLocaleString() + ")" : ""));
  }
  q(dev, ".mode").textContent = t.state !== undefined ? (MODES[t.state] || ("state " + t.state)) : "";
  // KPIs
  q(dev, ".pv").textContent = fmt(t.P, 1);
  q(dev, ".peak").textContent = "peak today " + fmt(t.Pmax, 1) + " W · " + fmtEnergy(t.Etoday);
  q(dev, ".vin").textContent = fmt(t.Ui, 1) + " V";
  q(dev, ".vout").textContent = fmt(t.Uo, 2) + " V";
  q(dev, ".iout").textContent = fmt(t.I, 2) + " A";
  q(dev, ".duty").textContent = Number.isFinite(t.duty) ? String(t.duty) : "–";
  q(dev, ".ntc").textContent = Number.isFinite(t.ntcT) ? fmt(t.ntcT, 1) + " °C" : "–";
  renderChg(dev);
  // rate line
  const parts = [];
  if (b && b.state === "on" && b.tele === "on"){
    const s = b.stream.stats;
    parts.push("BLE " + rateOf(dev, "ble").toFixed(1) + " pt/s · dropped " + b.dropped + " B · resyncs " + s.resyncs);
  }
  if (dev.mqtt.teleSeen){
    parts.push(L.state === "on"
      ? "MQTT " + rateOf(dev, "mqtt").toFixed(1) + " pt/s · dropped " + L.dropped + " B"
      : "MQTT relay " + rateOf(dev, "mqtt").toFixed(1) + " pt/s"
        + (L.state === "refused" ? " · lease refused" : L.state === "no-reply" ? " · lease no reply" : ""));
  }
  q(dev, ".rate").textContent = parts.join("  |  ");
  if (q(dev, "details.more").open) renderMore(dev, L);
  renderAge(dev);
  renderChart(dev);
  renderVin(dev);
  renderLog(dev);
  q(dev, "form.console input").disabled = !canSend(dev);
}

/* ---------------------------------------------------------------------------------------------
   P-vs-Vin chart: last sweep curve, MPP ring, live operating point, binned live curve
--------------------------------------------------------------------------------------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const CH = { w:320, h:170, l:34, r:10, t:12, b:22 };

function svgEl(tag, attrs, cls){
  const e = document.createElementNS(SVGNS, tag);
  if (cls) e.setAttribute("class", cls);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  return e;
}

// At most TICKS_MAX ticks; non-finite or degenerate input gives the plain [lo, hi] (or [0, 1]) axis.
const TICKS_MAX = 12;
function niceTicks(lo, hi, n){
  if (!Number.isFinite(lo) || !Number.isFinite(hi)){ lo = 0; hi = 1; }
  if (!(hi > lo)) hi = lo + 1;
  const fallback = () => hi > lo ? { lo, hi, ticks:[lo, hi], step:hi - lo } : { lo:0, hi:1, ticks:[0, 1], step:1 };
  const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const k = Math.round((b - a) / step);
  if (!Number.isFinite(step) || !(step > 0) || !Number.isFinite(b) || !(k >= 1) || k > TICKS_MAX || a + step === a)
    return fallback();
  const ticks = [];
  for (let i = 0; i <= k; i++) ticks.push(+(a + i * step).toFixed(9));
  return { lo:a, hi:b, ticks, step };
}

const STAR = "M0 -7L1.76 -2.43L6.66 -2.16L2.85 0.93L4.11 5.66L0 3L-4.11 5.66L-2.85 0.93L-6.66 -2.16L-1.76 -2.43Z";

  });

  svg.append(svgEl("g", {}, "grid"), svgEl("line", {}, "base"), svgEl("g", {}, "ylab"), svgEl("g", {}, "xlab"),
             svgEl("path", { d:"" }, "curve"), svgEl("path", { d:"" }, "recon"), svgEl("path", { d:"" }, "recon stale"),
             svgEl("path", { d:STAR }, "mpp-halo"), svgEl("path", { d:STAR }, "mpp"), svgEl("circle", { r:4 }, "live"));
  const empty = svgEl("text", { x:CH.w / 2, y:CH.h / 2, "text-anchor":"middle" }, "empty");

  hov.append(svgEl("line", { y1:CH.t, y2:CH.h - CH.b }), svgEl("circle", { r:3 }),
             svgEl("text", { x:CH.w - CH.r, y:CH.t - 2, "text-anchor":"end" }));
  svg.append(empty, hov);
  svg.addEventListener("pointermove", (e) => chartHover(dev, svg, e));

}

/* Vin over the last VIN.span ms, newest sample at the right edge; last sample per VIN.slot ms */
const VIN = { w:320, h:60, l:34, r:10, t:5, b:14, span:30000, slot:100 };

function createVinChart(){
  const w = el("div", "vinwrap");
  const bar = el("div", "vinbar");
  bar.append(el("span", "vincap", "Vin · last 30 s"), el("span", "spacer"), el("span", "vinv"));
  const svg = svgEl("svg", { viewBox:`0 0 ${VIN.w} ${VIN.h}`, role:"img", "aria-label":"input voltage, last 30 seconds" }, "vinchart");
  svg.append(svgEl("g", {}, "grid"), svgEl("line", {}, "base"), svgEl("g", {}, "ylab"), svgEl("g", {}, "xlab"));
  w.append(bar, svg);
  w.style.display = "none";
  return w;
}

function renderVin(dev){
  const w = q(dev, ".vinwrap"), a = dev.points.a, last = dev.points.last();
  if (last === dev.vinDrawn) return;
  dev.vinDrawn = last;
  const end = last ? last.ts : 0, t0 = end - VIN.span, pts = [];
  for (let i = a.length - 1; i >= 0 && a[i].ts >= t0; i--){
    const p = a[i];
    if (!Number.isFinite(p.Ui) || p.ts > end) continue;
    const s = Math.floor((p.ts - t0) / VIN.slot);
    if (!pts.length || s < pts[pts.length - 1].s) pts.push({ s, ts:p.ts, V:p.Ui });
  }
  const svg = w.querySelector("svg"), old = svg.querySelector("path.vin");
  if (!pts.length){ w.style.display = "none"; if (old) old.remove(); return; }
  w.style.display = "";
  pts.reverse();
  let lo = Infinity, hi = -Infinity;
  for (const p of pts){ lo = Math.min(lo, p.V); hi = Math.max(hi, p.V); }
  if (hi - lo < 1e-6){ lo -= 1; hi += 1; } else { const m = (hi - lo) * 0.05; lo -= m; hi += m; }
  const yd = niceTicks(lo, hi, 3);
  const X = (ts) => VIN.l + (ts - t0) / VIN.span * (VIN.w - VIN.l - VIN.r);
  const Y = (v) => VIN.h - VIN.b - (v - yd.lo) / (yd.hi - yd.lo) * (VIN.h - VIN.t - VIN.b);
  const key = yd.lo + "," + yd.hi;
  if (key !== dev.vinKey){
    dev.vinKey = key;
    const grid = svg.querySelector("g.grid"), yl = svg.querySelector("g.ylab"), xl = svg.querySelector("g.xlab");
    grid.replaceChildren(); yl.replaceChildren(); xl.replaceChildren();
    for (const v of yd.ticks){
      if (v > yd.lo) grid.append(svgEl("line", { x1:VIN.l, x2:VIN.w - VIN.r, y1:Y(v), y2:Y(v) }));
      const tx = svgEl("text", { x:VIN.l - 4, y:Y(v) + 3, "text-anchor":"end" });
      tx.textContent = v === yd.hi ? v + " V" : String(v);
      yl.append(tx);
    }
    for (const s of [-30, -20, -10, 0]){
      const tx = svgEl("text", { x:X(end + s * 1000), y:VIN.h - VIN.b + 10, "text-anchor":s ? "middle" : "end" });
      tx.textContent = s ? s + " s" : "0";
      xl.append(tx);
    }
    const base = svg.querySelector("line.base");
    base.setAttribute("x1", VIN.l); base.setAttribute("x2", VIN.w - VIN.r);
    base.setAttribute("y1", Y(yd.lo)); base.setAttribute("y2", Y(yd.lo));
  }
  const path = old || svg.appendChild(svgEl("path", {}, "vin"));
  path.setAttribute("d", pts.map((p, i) => (i ? "L" : "M") + X(p.ts).toFixed(1) + " " + Y(p.V).toFixed(1)).join(""));
  q(dev, ".vinv").textContent = fmt(pts[pts.length - 1].V, 1) + " V";
}

const show = (e, on) => e.setAttribute("visibility", on ? "visible" : "hidden");

function renderChart(dev){
  const svg = q(dev, "svg.chart"), t = dev.tele;
  const curve = dev.curve ? dev.curve.points.filter(p => sane(p.V, p.P)) : [];
  const recon = reconPoints(dev);
  const live = !dev.restored && sane(t.Ui, t.P) ? { V:t.Ui, P:t.P } : null;
  const mpp = dev.curve && sane(dev.curve.mpp.V, dev.curve.mpp.P) && dev.curve.mpp.P > 0 ? dev.curve.mpp : null;
  renderCaption(dev);
  const empty = svg.querySelector("text.empty");
  const all = curve.concat(recon, live ? [live] : [], mpp ? [mpp] : []);
  for (const p of all) if (p.P > dev.pTop) dev.pTop = Math.min(p.P, LIM.P);
  if (!all.length){
    empty.textContent = dev.curveNone ? "no sweep recorded since boot" : "no sweep curve yet";
    show(empty, true);
    for (const p of svg.querySelectorAll("path.curve, path.recon")) p.setAttribute("d", "");
    for (const s of ["path.mpp", "path.mpp-halo", "circle.live"]) show(svg.querySelector(s), false);
    for (const s of ["g.grid", "g.ylab", "g.xlab"]) svg.querySelector(s).replaceChildren();
    show(svg.querySelector("line.base"), false);
    dev.chartKey = null; dev.chartScale = null; dev.reconDrawn = -1;
    return;
  }
  show(empty, false);
  const vs = all.map(p => p.V);
  let vlo = Math.min(...vs), vhi = Math.max(...vs);
  if (vhi - vlo < 2){ vlo -= 1; vhi += 1; }
  const xd = niceTicks(vlo, vhi, 5), yd = niceTicks(0, dev.pTop, 4);
  const X = (v) => CH.l + (v - xd.lo) / (xd.hi - xd.lo) * (CH.w - CH.l - CH.r);
  const Y = (p) => CH.h - CH.b - Math.max(0, p) / yd.hi * (CH.h - CH.t - CH.b);
  dev.chartScale = { X, Y, pts: curve.length ? curve : recon };
  const key = xd.lo + "," + xd.hi + "," + yd.hi + "," + dev.ver;
  const d = (pts) => pts.map((p, i) => (i ? "L" : "M") + X(p.V).toFixed(1) + " " + Y(p.P).toFixed(1)).join("");
  if (key !== dev.chartKey || dev.reconDrawn !== dev.reconVer){
    dev.reconDrawn = dev.reconVer;
    const at = now(), ds = ["", ""], seg = (p) => X(p.V).toFixed(1) + " " + Y(p.P).toFixed(1);
    let prev = -1;
    recon.forEach((p, i) => {
      const join = i && p.V - recon[i - 1].V <= RECON.gapV;
      const old = at - p.at > RECON.staleMs;
      const c = join ? +(old || at - recon[i - 1].at > RECON.staleMs) : +old;
      if (join && c === prev) ds[c] += "L" + seg(p);
      else ds[c] += "M" + (join ? seg(recon[i - 1]) + "L" : "") + seg(p);
      prev = c;
    });
    svg.querySelector("path.recon:not(.stale)").setAttribute("d", ds[0]);
    svg.querySelector("path.recon.stale").setAttribute("d", ds[1]);
  }
  if (key !== dev.chartKey){
    dev.chartKey = key;
    const grid = svg.querySelector("g.grid"), yl = svg.querySelector("g.ylab"), xl = svg.querySelector("g.xlab");
    grid.replaceChildren(); yl.replaceChildren(); xl.replaceChildren();
    for (const v of yd.ticks){
      if (v > 0) grid.append(svgEl("line", { x1:CH.l, x2:CH.w - CH.r, y1:Y(v), y2:Y(v) }));
      const tx = svgEl("text", { x:CH.l - 4, y:Y(v) + 3, "text-anchor":"end" });
      tx.textContent = v === yd.hi ? v + " W" : String(v);
      yl.append(tx);
    }
    for (const v of xd.ticks){
      const tx = svgEl("text", { x:X(v), y:CH.h - CH.b + 12, "text-anchor":"middle" });
      tx.textContent = v === xd.hi ? v + " V" : String(v);
      xl.append(tx);
    }
    const base = svg.querySelector("line.base");
    base.setAttribute("x1", CH.l); base.setAttribute("x2", CH.w - CH.r);
    base.setAttribute("y1", Y(0)); base.setAttribute("y2", Y(0));
    show(base, true);
    const pc = svg.querySelector("path.curve");
    pc.setAttribute("d", d(curve));
    pc.classList.toggle("flagged", !!(dev.curve && dev.curve.flag));
    for (const s of ["path.mpp-halo", "path.mpp"]){
      const c = svg.querySelector(s);
      show(c, !!mpp);
      if (mpp) c.setAttribute("transform", `translate(${X(mpp.V).toFixed(1)} ${Y(mpp.P).toFixed(1)})`);
    }
  }
  const lc = svg.querySelector("circle.live");
  show(lc, !!live);
  if (live){ lc.setAttribute("cx", X(live.V).toFixed(1)); lc.setAttribute("cy", Y(live.P).toFixed(1)); }
}

function fmtSweepTime(ts){
  const d = new Date(ts * 1000), n = new Date(now());
  const hm = d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  return d.toDateString() === n.toDateString() ? hm : d.toLocaleDateString() + " " + hm;
}

function renderCaption(dev){
  const c = dev.curve, parts = [];
  if (c){
    if (c.t > 0) parts.push("sweep " + fmtSweepTime(c.t));
    if (c.mpp.P > 0) parts.push("MPP " + c.mpp.P.toFixed(1) + " W @ " + c.mpp.V.toFixed(1) + " V");
    if (c.sweeping) parts.push("sweeping");
    else if (c.flag) parts.push("sky changed during sweep");
  } else if (dev.curveNone) parts.push("no sweep recorded");
  if (dev.tele.state === 5) parts.push("sweep in progress");
  if (dev.curveReq) parts.push("loading…");
  else if (dev.curveErr) parts.push(dev.curveErr);
  q(dev, ".chartbar .caption").textContent = parts.join(" · ");
  q(dev, "button.refresh").disabled = !!dev.curveReq || !canSend(dev);
  q(dev, "button.sweep").disabled = dev.tele.state === 5 || !canSend(dev);
}

// Crosshair snaps to the nearest curve point (or the live curve when no curve is known).
function chartHover(dev, svg, e){
  const s = dev.chartScale, hov = svg.querySelector("g.hover");
  if (!s || !s.pts.length){ show(hov, false); return; }
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const x = (e.clientX - r.left) / r.width * CH.w;
  let best = s.pts[0], bd = Infinity;
  for (const p of s.pts){ const dd = Math.abs(s.X(p.V) - x); if (dd < bd){ bd = dd; best = p; } }
  const px = s.X(best.V), py = s.Y(best.P);
  const [ln, dot, tx] = hov.children;
  ln.setAttribute("x1", px); ln.setAttribute("x2", px);
  dot.setAttribute("cx", px); dot.setAttribute("cy", py);
  tx.textContent = best.P.toFixed(1) + " W · " + best.V.toFixed(1) + " V";
  show(hov, true);
}

function renderLog(dev){
  const box = q(dev, ".log");
  if (dev.logReset){ box.replaceChildren(); dev.logReset = false; dev.logNew = dev.log.a.slice(-LOG_SHOW); }
  if (!dev.logNew.length) return;
  const atBottom = box.scrollHeight - box.clientHeight - box.scrollTop < 4;
  const frag = document.createDocumentFragment();
  for (const e of dev.logNew){
    const d = el("div", e.cls || null);
    if (/\x1b\[/.test(e.text)) d.appendChild(document.createRange().createContextualFragment(window.ansiConvert.toHtml(e.text)));
    else d.textContent = e.text;
    frag.append(d);
  }
  dev.logNew = [];
  box.append(frag);
  while (box.childElementCount > LOG_SHOW) box.firstElementChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

async function consoleSend(dev, cmd){
  cmd = String(cmd).replace(/[\r\n]+$/, "");
  if (!cmd.trim()) return;
  if (dev.history[dev.history.length - 1] !== cmd) dev.history.push(cmd);
  if (dev.history.length > 50) dev.history.shift();
  dev.histIdx = dev.history.length;
  pushLog(dev, "sent", "» " + cmd);
  try { await send(dev, cmd); }
  catch(e){ pushLog(dev, "err", "send failed: " + (e.message || e)); }
}

/* ---------------------------------------------------------------------------------------------
   1 s tick: ages, lease start/renewal, BLE dropped-counter probe
--------------------------------------------------------------------------------------------- */
function tick(){
  const t = now();
  for (const dev of devices.values()){
    renderAge(dev);
    if (dev.recon.size && reconAge(dev, t)) scheduleRender(dev);
    const L = dev.mqtt.lease;
    if (leaseWanted(dev) && !L.busy){
      if (L.state === "off" && dev.mqtt.firstAt && t - dev.mqtt.firstAt >= LEASE_WAIT_MS){
        lease(dev);
        if ((!dev.curve || dev.curveRestored) && !dev.curveNone) requestCurve(dev);
        requestChargerStatus(dev);
      } else if (leaseRetries(L) && dev.mqtt.teleSeen && t - dev.mqtt.teleAt >= SILENT_MS && t - L.silentAt >= SILENT_MS){
        L.silentAt = t;
        lease(dev);
      } else if (leaseRetries(L) && t - L.at >= RENEW_MS){
        lease(dev);
      }
    }
    if (dev.ble) dev.ble.probe();
    if (dev.chgReqAt && t - dev.chgReqAt >= CFG.chargerMs && document.visibilityState === "visible"
        && (dev.mqtt.firstAt || (dev.ble && dev.ble.state === "on"))) requestChargerStatus(dev);
    if (dev.lastAt && t - dev.lastAt < 15000) scheduleRender(dev);
  }
}

function onVisible(){
  if (document.visibilityState !== "visible") return;
  for (const dev of devices.values()){
    const L = dev.mqtt.lease;
    if (leaseRetries(L) && leaseWanted(dev) && now() - L.at >= 5000) lease(dev);
  }
}

/* ---------------------------------------------------------------------------------------------
   Broker discovery: mqtt.conf of a BLE-linked device, then a WebSocket port probe
--------------------------------------------------------------------------------------------- */
const CONF_LINE = /Conf '\/littlefs\/conf\/([^:']+):([^']+)' = '(.*)'\s*$/;
const WS_PORTS = [1885, 9001, 8083, 8080];
const WSS_PORTS = [8884, 8084, 443]; // an https page can only open wss://
let found = null, discovering = false;
const probed = new Set();
const brokerUnset = () => !client && !lsGet(LS.url) && !$("mqtt-url").value.trim();

function parseBroker(uri){
  uri = (uri || "").trim();
  if (!uri) return null;
  try {
    const u = new URL(/^[a-z][\w+.-]*:\/\//i.test(uri) ? uri : "mqtt://" + uri);
    return u.hostname ? { host:u.hostname, port:+u.port || (/^mqtts|ssl/i.test(u.protocol) ? 8883 : 1883) } : null;
  } catch(_){ return null; }
}

function wsCandidates({ host, port }){
  if (location.protocol === "https:") return WSS_PORTS.map(p => "wss://" + host + ":" + p);
  const ports = WS_PORTS.includes(port) ? WS_PORTS : [...WS_PORTS, port];
  return ports.map(p => "ws://" + host + ":" + p);
}

// First URL whose WebSocket (subprotocol mqtt) opens within CFG.wsProbeMs, tried in order; else null.
async function probeWs(urls){
  for (const url of urls){
    const ok = await new Promise(res => {
      let ws = null;
      const fin = (v) => {
        clearTimeout(t);
        if (ws){ ws.onopen = ws.onerror = ws.onclose = null; try { ws.close(); } catch(_){} }
        res(v);
      };
      const t = setTimeout(() => fin(false), CFG.wsProbeMs);
      try { ws = new WebSocket(url, "mqtt"); } catch(_){ fin(false); return; }
      ws.onopen = () => fin(true);
      ws.onerror = ws.onclose = () => fin(false);
    });
    if (ok) return url;
  }
  return null;
}

async function discoverBroker(dev){
  if (discovering || !brokerUnset()) return;
  discovering = true;
  try {
    let r;
    try { r = await sendCommand(dev, "get-config mqtt.conf", { via:"ble", timeoutMs:CFG.confMs }); } catch(_){ return; }
    const kv = {};
    for (const l of r.lines){ const m = CONF_LINE.exec(TD.stripAnsi(l)); if (m && m[1] === "mqtt.conf") kv[m[2]] = m[3]; }
    const b = parseBroker(kv.broker_uri);
    if (!b || probed.has(b.host)) return;
    probed.add(b.host);
    const url = await probeWs(wsCandidates(b));
    if (!brokerUnset()) return;
    if (!url){ found = { kind:location.protocol === "https:" ? "https" : "none", host:b.host }; banners(); return; }
    $("mqtt-url").value = url;
    // only credentials from the same mqtt.conf: a remembered password must not ride along to a device-chosen host
    $("mqtt-user").value = kv.username || "";
    $("mqtt-pass").value = kv.password || "";
    found = { kind:"ok", host:b.host, url, from:dev.host };
    banners();
  } finally { discovering = false; }
}

function foundBanner(){
  if (!found) return null;
  if (found.kind === "https") return el("div", "banner", "broker at " + found.host + ": no wss:// listener on the usual ports, or its certificate is not trusted by this browser");
  if (found.kind === "none") return el("div", "banner", "broker " + found.host + " has no WebSocket listener on the usual ports");
  const d = el("div", "banner found", "MQTT broker found at " + found.url + " (from " + found.from + ") — Connect? ");
  const b = el("button", "primary", "Connect");
  b.onclick = connectClicked;
  d.append(b);
  return d;
}

/* ---------------------------------------------------------------------------------------------
   Header, banners, start-up
--------------------------------------------------------------------------------------------- */
let noPass = false;   // stored broker + user but no password: do not auto-connect, ask instead
function banners(){
  const out = [];
  if (noPass) out.push("MQTT: enter the broker password and press Connect (tick \"remember\" to keep it).");
  if (location.protocol === "file:")
    out.push("Opened from file://: serve this folder over http (python3 -m http.server) so Web Bluetooth is available.");
  if (!navigator.bluetooth)
    out.push("Web Bluetooth is not available: use Chrome or Edge over https or localhost.");
  if (location.protocol === "https:" && /^ws:\/\//i.test($("mqtt-url").value.trim()))
    out.push("An https page cannot open ws:// connections: use a wss:// broker URL.");
  const box = $("banners");
  const fb = foundBanner();
  box.replaceChildren(...out.map(t => el("div", "banner", t)), ...(fb ? [fb] : []));
  $("ble-add").disabled = !navigator.bluetooth;
}

function connectClicked(){
  if (client){ mqttDisconnect(); return; }
  if (noPass){ noPass = false; banners(); }
  const url = $("mqtt-url").value.trim(), user = $("mqtt-user").value, pass = $("mqtt-pass").value;
  lsSet(LS.url, url); lsSet(LS.user, user);
  if ($("mqtt-remember").checked) lsSet(LS.pass, pass); else lsDel(LS.pass);
  if (!url){ setStatus("enter a broker URL", true); return; }
  if (found){ found = null; banners(); }
  mqttConnect(url, user, pass);
}

function init(){
  // ?mqtt=<ws url>&user=<name> prefill without connecting; a password is never taken from the URL
  const qp = new URLSearchParams(location.search), qUrl = (qp.get("mqtt") || "").trim(), qUser = qp.get("user");
  $("mqtt-url").value = qUrl || lsGet(LS.url) || "";
  $("mqtt-user").value = qUser !== null ? qUser : lsGet(LS.user) || "";
  const rem = lsGet(LS.remember) !== "0";   // remember the password unless the user unticked it
  $("mqtt-remember").checked = rem;
  const sameHost = (a, b) => { try { return new URL(a).hostname === new URL(b).hostname; } catch (e) { return false; } };
  // a ?mqtt= link for another host must not get the remembered password
  $("mqtt-pass").value = rem && (!qUrl || sameHost(qUrl, lsGet(LS.url) || "")) ? lsGet(LS.pass) || "" : "";
  if (!rem) lsDel(LS.pass);
  $("mqtt-remember").onchange = () => {
    lsSet(LS.remember, $("mqtt-remember").checked ? "1" : "0");
    if (!$("mqtt-remember").checked) lsDel(LS.pass);
  };
  const ct = $("console-toggle");
  ct.checked = lsGet(LS.console) === "1";
  document.body.classList.toggle("show-console", ct.checked);
  ct.onchange = () => { document.body.classList.toggle("show-console", ct.checked); lsSet(LS.console, ct.checked ? "1" : "0"); };
  $("mqtt-url").addEventListener("input", banners);
  $("mqtt-connect").onclick = connectClicked;
  $("ble-add").onclick = () => addBle();
  document.addEventListener("visibilitychange", onVisible);
  window.addEventListener("pagehide", () => saveSnaps());
  restoreSnaps();
  banners();
  setInterval(tick, 1000);
  if (!qUrl && $("mqtt-url").value.trim()) {
    if ($("mqtt-user").value && !$("mqtt-pass").value) { noPass = true; banners(); }
    else mqttConnect($("mqtt-url").value, $("mqtt-user").value, $("mqtt-pass").value);
  }
  restoreBle();
}

window.Dash = {
  devices, Device, BleLink, REPLY, CFG, NUS:{ SVC:NUS_SVC, RX:NUS_RX, TX:NUS_TX, TELE:NUS_TELE },
  getDevice, ingest, ingestTele, onLine, onMqttMessage, send, sendCommand, requestCurve, requestChargerStatus,
  parseChargerStatus, lease, tick, niceTicks,
  attachBle, LIM, saveSnaps, forget, probeWs, wsCandidates, parseBroker, discoverBroker, connectClicked,
  flush, mqttConnect, mqttDisconnect, addBle, linkBle, restoreBle, consoleSend, staleAfter,
  get client(){ return client; },
};

init();
})();
</script>
