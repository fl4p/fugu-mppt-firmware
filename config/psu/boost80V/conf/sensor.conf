# Boost: Vin = LV side (bench PSU) on INA226, Vout = HV side on internal ADC divider
lv_v_adc=ina226
lv_v_ch=0
lv_v_rh=47e3
lv_v_rl=47e3
lv_v_filt_len=20

hv_v_adc=esp32adc1
hv_v_ch=3
hv_v_rh=200e3
hv_v_rl=7.5e3
hv_v_filt_len=20

# lv_i_ch=255  # no separate LV-side current sensor (see hv_i below)
lv_i_filt_len=20

# Migrated as-is from iout_*: under boost iout is the HV side. The INA226 sits on LV (see lv_v),
# so this shunt is likely LV-side (lv_i_*) -- verify wiring and sign before use.
hv_i_adc=ina226
hv_i_ch=1
hv_i_factor=1.0
hv_i_filt_len=20

ntc_adc=esp32adc1
