# Converted value-preserving from the old role keys under topo=boost. Unverified which side the INA226
# current shunt sits on: it is set up as hv_i, but the INA226 voltage channel is on LV, which would
# put the shunt on LV (lv_i). The current sign is unverified too.
esp32adc1_sr=83333
esp32adc1_avg=8

expected_hz=200
power_conversion_eff=0.97

# Boost: Vin = LV side (bench PSU) on INA226, Vout = HV side on internal ADC divider
lv_v_adc=ina226
lv_v_ch=0
lv_v_rh=47e3
lv_v_rl=47e3
lv_v_filt_len=20

hv_v_adc=esp32adc1
hv_v_ch=3
hv_v_rh=200e3
hv_v_rl=7.5e3
hv_v_filt_len=20

# lv_i_ch=255  # no separate input current sensor
lv_i_filt_len=20

hv_i_adc=ina226
hv_i_ch=1
hv_i_factor=1.0
hv_i_filt_len=20

ntc_adc=esp32adc1
ntc_ch=7
ntc_filt_len=20
