# vout_max is required: the maximum voltage of your pack, e.g. vout_max=14.6 for a 4s LFP pack.
# Without it setup fails and the converter stays off.

# `cv_eoc`
# End-of-charge voltage of battery cell
# The charger will maintain pack voltage so that voltage of the highest cell stays below `cv_eoc`
# The BMS needs to provide cell voltage through MQTT. See `mqtt.conf:cell_voltages_max_topic`.
# see https://github.com/fl4p/batmon-ha
# firmware default: cv_eoc=3.5

# when to start reducing charge current
# firmware default: cv_float=3.325
