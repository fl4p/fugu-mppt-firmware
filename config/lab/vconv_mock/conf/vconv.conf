# PV source: Isc 13A, Voc 76V, k=V_mpp/Voc=0.85 -> MPP ~65V, ~790W (steep knee).
pv_isc=13.0
pv_voc=76.0
pv_k=0.85

# Sun and clouds (off: sun_day_s=0). A 10-minute day, 2.5-minute night, ~4 clouds/min of 15 s:
# sun_day_s=600
# sun_night_s=150
# sun_peak=1.0
# cloud_rate=4
# cloud_depth=0.7
# cloud_len_s=15
# cloud_edge_s=3
# sun_seed=1

# Battery sink: 28V (8-cell LFP pack), small series R for stiffness.
# Open-circuit output preset: v_bat=0, r_bat=1e9 (or `vconv bat open` at runtime).
v_bat=27.0
r_bat=0.05

# Inverter ripple on V_bat. Default off; enable to stress the vout notch.
# Modelled from the fry 2 kW-inverter capture (etc/adcscope/data/fry/2000w-inverter-midday-...):
# a near-pure SINE at 2x line, ~0.6% RMS of V_bat (measured 2nd harmonic <1%) — an inverter draws
# cos(2*line) reactive power so the bus ripple is sinusoidal, NOT |sin|. For that fry profile set
# vbat_ac_amp=0.26 (peak V; 0.26 on ~28 V ≈ 0.6% RMS), vbat_ac_freq=100.
# vbat_ac_shape: 0 = sine (inverter), 1 = full-wave |sin| (rectifier load, ~20% 2nd harmonic),
#   2 = spiky cheap-China-inverter pulse (narrow per-cycle current draw, h2/h1 ~0.7, harmonics that
#   alias past Nyquist; modelled from etc/adcscope/data/china-inverter-1kw-load). Spike-stress profile:
#   vbat_ac_shape=2, vbat_ac_amp~0.3, vbat_ac_freq~660 (~0.22 cyc/sample at adc_freq=3000).
vbat_ac_amp=0.0
vbat_ac_freq=100
vbat_ac_shape=0

# Passives. L comes from coil.conf::L0 (50 µH for wokwi_mock-derived defaults).
plant_c_in=470e-6
plant_c_out=470e-6

# Buck switch-node ring: while both switches are off the node capacitance (mostly FET Coss) rings
# with the coil between the body-diode clamps; the coil current at HS turn-on shifts the energy per
# cycle (Iout ripples +-10..20 % versus duty in DCM), a reverse current at LS turn-off lifts the node
# to Vin. Ring frequency 1/(2*pi*sqrt(L0*ring_c)).
# ring_c: node capacitance [F], 0 = off. ring_q: quality factor (decay e^(-pi*f*t/Q)).
# Field fits: 4.9 nF / Q 25 at 80 uH (254 kHz), 4.7 nF / Q 15 at 51 uH (326 kHz); rect-cal tails at
# 80 uH: 5 nF / Q 40.
ring_c=0
ring_q=20

# Switch timing and losses (all 0 = ideal; see website/docs/reference/config/vconv.md). SPICE-fitted
# board sets are in test/host-stub/plant_boards.h, e.g. an 80 uH board:
# ring_c=6.14e-9 ring_v=75 ring_cexp=0.6 ring_ct=0.75 ring_q=25 diode_vf=0.7 t_dead=185e-9
# r_hs=0.008 r_ls=0.014 t_sw=100e-9

# Sampling tick (also the cycle-step granularity).
adc_freq=500 # 1000+ intermittently starves IDLE1 on the S3 (task WDT); the loop-rate watchdog trips below half of it

# Per-channel zero-mean Gaussian ADC noise σ (physical units). 0 = deterministic.
# For the fry inverter profile, noise_vout=0.03 models the ~0.12% RMS broadband residual (the ~20%
# of Vout AC beyond the 2x-line sine; partly INA226 measurement noise).
noise_vin=0.0
noise_iin=0.0
noise_iout=0.0
noise_vout=0.0
noise_ntc=0.0
