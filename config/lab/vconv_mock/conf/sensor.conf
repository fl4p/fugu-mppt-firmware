adc=vconv
expected_hz=2500
power_conversion_eff=0.97

# Channel mapping is fixed in ADC_VConv: 0=Vin, 1=Vout, 2=Iout, 4=NTC.
# The channel number is the simulated role; topo=buck puts Vin on hv_v, Vout/Iout on lv_v/lv_i.
# Iin is omitted -> setupSensors uses a VirtualSensor (Iout·Vout / Vin / eff).

hv_v_ch=0
hv_v_rh=0       # identity LinearTransform (ADC_VConv returns physical V)
hv_v_rl=1
hv_v_filt_len=3

lv_v_ch=1
lv_v_rh=0
lv_v_rl=1
lv_v_filt_len=3

lv_i_ch=2
lv_i_factor=1.0
lv_i_midpoint=0.0
lv_i_filt_len=3

ntc_ch=4
ntc_filt_len=60

hv_i_filt_len=3
