mcu=esp32s3


i2c_sda=42
i2c_scl=2
i2c_freq=800000
i2c_port=0              # chose the ESP32 I2C controller (0 or 1)

ina226_alert=41
ina226_addr=0b1000000   # https://www.ti.com/lit/ds/symlink/ina226.pdf#page=18

pwm_freq=39000

pwm_driver_logic=HiLi
pwm_hi=21
pwm_li=14
pwm_sd=47

bflow_sd=40
bflow_bat=1             # backflow switch, Vout and current sensor on the battery side (as fmetal): vout_max=auto, idle HS-short check, selftest bflow

led_WS2812=1
