# 29 V was the CV setpoint for charging a battery on this bench. It is also the OV trip
# reference (mppt: "Vout 43.6V > 29.0V + 5pct!"), so with the output OPEN -- where Vout floats
# up to Vin -- it shuts the converter down on every Vin above ~30 V. Measured 2026-08-11 during
# the SW-ring Vin sweep, once the boot_refresh_ns fix let the HS FET actually conduct and the
# buck started charging its own open output.
#
# Raised to the board's stated output limit (limits.conf vout_max=60), NOT beyond it: with an
# open output Vout == Vin, so the sweep's Vin ceiling is bounded by the OUTPUT rating.
vout_max=60
