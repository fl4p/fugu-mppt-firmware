topo=boost
forced_pwm=1
pwm_driver=mcpwm
vout_max=75
sync_role=leader
sync_phase_deg=180

# Solar-array-simulator: output follows the PV curve V=f(Iout).
# Voc=60: 1.5*Voc=90 clamps at limits vout_max=85, so set an explicit `ovset` (e.g. 70)
# for a tight OV guard during bring-up. MPP = k*Voc = 48 V, above vin_min=26.
mode=pv
pv_isc=5
pv_voc=60
pv_k=0.8
#pv_slew=200
#pv_iout_span=16
