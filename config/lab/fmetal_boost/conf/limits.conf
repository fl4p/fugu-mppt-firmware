# hardware limits, change with care

vin_min=8       # prevent board supply under-voltage

hv_max=85       # Vout max under topo=boost
lv_max=60       # Vin max under topo=boost

hv_i_max=30     # side ratings as in config/fmetal (Iout max under topo=boost)
lv_i_max=32     # Iin max under topo=boost. The live board kept Iin max 30, Iout max 32 (role keys);
                # migrating it value-preserving gives lv_i_max=30, hv_i_max=32
iout_short=6

p_max=1000     # used for temperature de-rating
temp_max=90
temp_derate=70

reverse_current_paranoia=0
