# coil parameters for ripple current computation
# 80 uH as built on `flu` (the board that replaced the fbuck that faulted 2026-08-13), confirmed
# by Fab 2026-08-14. Was 40e-6, which described the previous board and disagreed with the loss
# model either way (loss/examples/ftall.yaml carried 50e-6). L0 feeds the ripple-current
# computation and hence the CCM/DCM call -- and a wrong conduction mode is what silently
# invalidated the pre-2026-08-12 sweeps, since loss.py assumes CCM.
L0=80e-6               # initial inductance
#turns=19            # num of turns
#core_mpl=nan        # magnetic path length
#core_mat=sendust-60 # sdendust-60, sendust-90, sendust-125 (dc bias model)