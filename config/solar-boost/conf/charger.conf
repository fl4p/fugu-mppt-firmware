
vout_max=58

# `cv_eoc`
# End-of-charge voltage of battery cell
# The charger will maintain output voltage (= battery pack voltage) so that voltage of the highest cell stays below `cv_eoc`
# The BMS needs to provide cell voltage through MQTT. See `mqtt.conf:cell_voltages_max_topic`.
# see https://github.com/fl4p/batmon-ha
# firmware default: cv_eoc=3.5

# when to start reducing charge current (float)
# firmware default: cv_float=3.325
