mcu=esp32s3

# I2C bus
i2c_sda=42
i2c_scl=2
i2c_freq=800000
i2c_port=0              # chose the ESP32 I2C controller (0 or 1)

# INA226
ina22x_alert=41
ina22x_addr=0b1000000   # https://www.ti.com/lit/ds/symlink/ina226.pdf#page=18
ina22x_resistor=0.5e-3
ina22x_range=35         # < (40mV/ina22x_resistor) for 40mV PGA config
ina22x_conv_time_us=1100 # per-conversion time; ~850 SPS at 588, ~450 at 1100 (lower=faster/noisier)


# PWM driver
pwm_freq=39000
pwm_driver_logic=HiLi   # `HiLi` or `InEn` gate driver input logic
pwm_hi=21
pwm_li=14
pwm_sd=47
#boot_refresh_ns=1500   # min LS on-time to refresh HS bootstrap cap (lower=better light-load eff, validate Vgs(HS) at max duty/no load)

panel_sd=40

#lv_pgood=35             # LV_PGOOD, high disables the HV aux supply path. GPIO35 is unusable on octal-PSRAM modules (N*R8)
#lv_pgood_v=10.5

led_WS2812=1

# fan=36                # fan PWM pin
