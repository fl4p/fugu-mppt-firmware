
vout_max=29     # max pack voltage
ibat_max=100    # max pack current
bat_c=280       # [Ah]
tail_c_rate=0.05
recharge_dod=0.2

cv_eoc=3.57
# ^ End-of-charge voltage of battery cell. for LFP this is usually 3.65V @ I=0.05 C
# The charger will maintain output voltage (= battery pack voltage) so that voltage of the highest cell stays below this value
# The BMS needs to provide cell voltage through MQTT. See `mqtt.conf:cell_voltages_max_topic`.
# see https://github.com/fl4p/batmon-ha


cv_float=3.37
# ^ lower cell voltage when to enter C-V phase (voltage where the termination line crosses zero current)
# For LFP this is usually 3.37V


# vout_max_fallback=27
# ^ max output voltage if BMS data is not available. defaults to floor(vout_max/cv_eoc) * cv_float
# set this to 0 to completely disable the converter when BMS communication is not available.

# partial_charge=0.8
# ^ stop charging at this SoC (Ah-counted from the last full charge) and hold it by following the load,
# so the pack does not sit at 100 %. Charges to full every full_charge_interval days for BMS balancing,
# and once after every reboot. Needs bat_c and mqtt.conf:ibat_topic. 0 = always charge to full.
# full_charge_interval=7

# bat_temp_min=0
# bat_temp_derate=45
# bat_temp_max=55
# ^ pack temperature policy, needs mqtt.conf:bat_temp_topic: no charging below bat_temp_min,
# charge current ramps down from bat_temp_derate to zero at bat_temp_max
