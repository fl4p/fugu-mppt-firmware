topo=buck       # buck, boost
forced_pwm=1    # set to 1 to enable forced PWM mode, converter will run in CCM even at light loads,
# 0: no bring-up gate. The gate's settled path WOULD engage at a light/no-load
# output, so this is not about reaching forced PWM - it is about not waiting for
# fpwm_gate_hold, and it assumes this PSU's output is never precharged or stiff.
# If it can be, set 1: with the gate off, a duty ramp from zero into a charged
# output is the destructive case. Either way never ramp the duty to 0 in forced
# PWM - a complementary LS at duty ~0 shorts the output through the coil.
fpwm_gate=0
